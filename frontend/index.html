<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Qaim Spare Parts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563EB'/%3E%3Ctext x='16' y='21' font-family='Arial' font-size='13' font-weight='700' text-anchor='middle' fill='white'%3EAQ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="intro" id="intro" role="presentation">
  <div class="gears" aria-hidden="true">
    <svg class="gear big" viewBox="-40 -40 80 80"><circle r="30" fill="none" stroke="currentColor" stroke-width="10" stroke-dasharray="7.854 7.854"/><circle r="24" fill="none" stroke="currentColor" stroke-width="4"/><circle r="7" fill="currentColor"/></svg>
    <svg class="gear small" viewBox="-40 -40 80 80"><circle r="30" fill="none" stroke="currentColor" stroke-width="10" stroke-dasharray="5.89 5.89"/><circle r="24" fill="none" stroke="currentColor" stroke-width="4"/><circle r="7" fill="currentColor"/></svg>
  </div>
  <div class="intro-title intro-word">Al Qaim</div>
  <div class="intro-sub intro-word">Spare Parts</div>
  <div class="intro-tag">Inventory manager</div>
  <div class="intro-bar"><i></i></div>
  <div class="intro-skip">Click anywhere to skip</div>
</div>


<div class="layout">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">AQ</span>
      <span>
        <span class="brand-name">Al Qaim</span>
        <span class="brand-sub">Spare Parts</span>
      </span>
    </div>
    <nav class="nav">
      <button class="nav-link active" data-page="inventory">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>
        Inventory
      </button>
      <button class="nav-link" data-page="prices">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg>
        Price List
      </button>
      <button class="nav-link" data-page="detailed">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        Detailed Inventory
      </button>
      <button class="nav-link" data-page="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Purchase History
      </button>
      <button class="nav-link" data-page="add-purchase">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6M13 10v4M11 12h4"/></svg>
        Add Purchase
      </button>
      <button class="nav-link" data-page="add-product">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v8M8 12h8"/></svg>
        Add Product
      </button>
      <button class="nav-link" data-page="suppliers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 6h13v10H1zM14 10h4l3 3v3h-7"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>
        Suppliers
      </button>
    </nav>
  </aside>

  <main class="content">
    <header class="topbar">
      <h1 id="page-title">Inventory</h1>
      <p id="page-sub" class="page-sub"></p>
    </header>

    <div id="alert-box" class="alert-box hidden"></div>

    <section id="page-content"></section>
  </main>

</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  var o = document.getElementById('intro');
  if (!o) return;
  var seen = false;
  try { seen = sessionStorage.getItem('introSeen'); } catch (e) {}
  if (seen || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) { o.remove(); return; }
  document.querySelectorAll('.intro-word').forEach(function (w, wi) {
    var t = w.textContent;
    w.textContent = '';
    t.split('').forEach(function (c, i) {
      var s = document.createElement('span');
      s.textContent = c === ' ' ? '\u00A0' : c;
      s.style.animationDelay = (0.5 + wi * 0.5 + i * 0.05) + 's';
      w.appendChild(s);
    });
  });
  var finished = false;
  function done() {
    if (finished) return;
    finished = true;
    o.classList.add('out');
    try { sessionStorage.setItem('introSeen', '1'); } catch (e) {}
    setTimeout(function () { o.remove(); }, 700);
  }
  o.addEventListener('click', done);
  setTimeout(done, 3200);
})();
</script>
</body>
</html>
