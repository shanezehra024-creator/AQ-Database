<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Inventory System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="layout">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">SP</span>
      <span class="brand-name">Spare Parts</span>
    </div>
    <nav class="nav">
      <button class="nav-link active" data-page="inventory">Inventory</button>
      <button class="nav-link" data-page="prices">Price List</button>
      <button class="nav-link" data-page="detailed">Detailed Inventory</button>
      <button class="nav-link" data-page="history">Purchase History</button>
      <button class="nav-link" data-page="add-purchase">Add Purchase</button>
    </nav>
  </aside>

  <main class="content">
    <header class="topbar">
      <h1 id="page-title">Inventory</h1>
    </header>

    <div id="alert-box" class="alert-box hidden"></div>

    <section id="page-content">
      <!-- Filled in by js/app.js depending on the selected page -->
    </section>
  </main>

</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
